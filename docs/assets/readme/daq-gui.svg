  <rect x="300" y="174" width="250" height="32" fill="#ffffff" stroke="#9ca3af"/>
  <text x="315" y="195" font-family="Consolas, monospace" font-size="14" fill="#374151">demo_daq_run.csv</text>
  <rect x="575" y="180" width="16" height="16" fill="#ffffff" stroke="#6b7280"/>
  <text x="600" y="194" font-family="Segoe UI, Arial" font-size="14" fill="#111827">Use timestamped filename</text>
  <text x="140" y="245" font-family="Segoe UI, Arial" font-size="15" fill="#111827">GPIB Address:</text>
  <rect x="300" y="224" width="120" height="32" fill="#ffffff" stroke="#9ca3af"/>
  <text x="315" y="245" font-family="Consolas, monospace" font-size="14" fill="#374151">27</text>
