<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Sanitized Keithley DAQ GUI screenshot mockup">
  <rect width="960" height="520" fill="#f7f7f7"/>
  <rect x="90" y="60" width="780" height="390" rx="10" fill="#ffffff" stroke="#bdbdbd"/>
  <rect x="90" y="60" width="780" height="44" rx="10" fill="#e9eef5" stroke="#bdbdbd"/>
