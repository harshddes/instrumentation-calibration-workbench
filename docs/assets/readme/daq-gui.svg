  <rect x="300" y="274" width="120" height="32" fill="#ffffff" stroke="#9ca3af"/>
  <text x="315" y="295" font-family="Consolas, monospace" font-size="14" fill="#374151">2</text>
  <text x="210" y="348" font-family="Segoe UI, Arial" font-size="14" fill="#111827">Channel 1 Name:</text>
  <rect x="335" y="328" width="150" height="28" fill="#ffffff" stroke="#9ca3af"/>
  <text x="348" y="347" font-family="Consolas, monospace" font-size="13" fill="#374151">DAQ_KEEPER_I</text>
  <text x="515" y="348" font-family="Segoe UI, Arial" font-size="14" fill="#111827">Chan 1 #:</text>
  <rect x="585" y="328" width="90" height="28" fill="#ffffff" stroke="#9ca3af"/>
  <text x="600" y="347" font-family="Consolas, monospace" font-size="13" fill="#374151">101</text>
  <text x="210" y="388" font-family="Segoe UI, Arial" font-size="14" fill="#111827">Channel 2 Name:</text>
  <rect x="335" y="368" width="150" height="28" fill="#ffffff" stroke="#9ca3af"/>
  <text x="348" y="387" font-family="Consolas, monospace" font-size="13" fill="#374151">DAQ_LP_V</text>
  <text x="515" y="388" font-family="Segoe UI, Arial" font-size="14" fill="#111827">Chan 2 #:</text>
  <rect x="585" y="368" width="90" height="28" fill="#ffffff" stroke="#9ca3af"/>
  <text x="600" y="387" font-family="Consolas, monospace" font-size="13" fill="#374151">102</text>
  <rect x="330" y="420" width="110" height="34" rx="4" fill="#dcfce7" stroke="#16a34a"/>
