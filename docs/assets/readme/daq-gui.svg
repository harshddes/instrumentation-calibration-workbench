  <rect x="470" y="420" width="110" height="34" rx="4" fill="#fee2e2" stroke="#dc2626"/>
  <text x="525" y="442" text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" fill="#7f1d1d">Stop</text>
